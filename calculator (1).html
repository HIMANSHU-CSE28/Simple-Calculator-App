<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Calculator</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:linear-gradient(to bottom,#000814,#0f172a);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:380px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(10px);
    border-radius:20px;
    padding:25px;
    text-align:center;
    box-shadow:0 0 20px rgba(0,0,0,0.5);
}

h1{
    color:#9cff2e;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:15px;
    margin:10px 0;
    border:2px solid #9cff2e;
    border-radius:10px;
    background:#111827;
    color:white;
    font-size:18px;
    outline:none;
}

.buttons{
    margin-top:15px;
}

button{
    width:65px;
    height:65px;
    margin:8px;
    border:none;
    border-radius:12px;
    background:#9cff2e;
    color:black;
    font-size:28px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.08);
}

.result-title{
    color:#9cff2e;
    margin-top:20px;
    font-size:30px;
}

#result{
    color:white;
    font-size:55px;
    margin-top:10px;
}

.profile-img{
    width:100px;
    height:150px;
    margin-top:25px;
    border-radius:12px;
    object-fit:cover;
    border:3px solid #9cff2e;
}
</style>
</head>

<body>

<div class="container">

    <h1>Digital Calculator</h1>

    <input type="number" id="num1" placeholder="First Number">

    <input type="number" id="num2" placeholder="Second Number">

    <div class="buttons">
        <button onclick="calculate('+')">+</button>
        <button onclick="calculate('-')">−</button>
        <button onclick="calculate('*')">×</button>
        <button onclick="calculate('/')">÷</button>
    </div>

    <div class="result-title">Result:</div>
    <div id="result">0</div>

    <!-- Apni photo ka naam yahan likhen -->
    <img src="  /img/1776082879616.jpg " alt="Profile Image" class="profile-img">

</div>

<script>
function calculate(operator){

    let num1 = parseFloat(document.getElementById("num1").value);
    let num2 = parseFloat(document.getElementById("num2").value);

    if(isNaN(num1) || isNaN(num2)){
        document.getElementById("result").innerHTML = "!";
        return;
    }

    let result;

    switch(operator){
        case '+':
            result = num1 + num2;
            break;

        case '-':
            result = num1 - num2;
            break;

        case '*':
            result = num1 * num2;
            break;

        case '/':
            result = num2 !== 0 ? num1 / num2 : "Error";
            break;
    }

    document.getElementById("result").innerHTML = result;
}
</script>

</body>
</html>
